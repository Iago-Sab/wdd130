<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Iago Saboia Martins">
</head>
<body>
    <header>
        <img src="images\basic-logo.png" alt="basic logo" width="128" height="128">

        <ul>
            <li><a href="google.com">Google</a></li>
            <li><a href="youtube.com">Youtube</a></li>
        </ul>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Provident, nisi!</p>
        </section>
        <section>
            <h2>Heading2</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Repellendus, eos.</p>
        </section>
        <aside>
            <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/aba-nigeria/320x200/aba-nigeria-temple-lds-1636397-wallpaper.jpg" alt="Nigeria Temple" width="200">
        </aside>
    </main>
    <footer>
        <p>Iago Saboia Martins</p>
    </footer>

</html>

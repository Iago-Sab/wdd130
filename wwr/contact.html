<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us WWR</title>
    <meta name="description" content="About contact information of the rafting company ">
    <meta name="author" content="Iago Saboia Martins">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="WWR logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div align="center">
            <h3>White Water Rafting Company</h3>
            <h4>123 Main River Street</h4>
            <h4>Kolob, California</h4>
            <h4>+1 999 999 9999</h4>
            <h4>info@whitewater.com</h4>
        </div>
        <div class="container-columns">
            <div class="column map-column">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d80931.64943912574!2d-113.29788205664062!3d37.42262819999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80ca91afad231a8f%3A0xec6734a36c88eb1f!2sKolob%20Canyons!5e1!3m2!1spt-BR!2sbr!4v1791511838304!5m2!1spt-BR!2sbr"
                  width="100%" height="100%" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <div class="column form-column">
                <form>
                    <label for="name">Name
                        <input type="text" id="name" name="name" required></label>

                    <label for="email" class="email">Email
                        <input type="email" id="email" name="email" required></label>

                    <fieldset>
                        <div class="message_title">Message Purpose</div>
                        <label>
                            <input type="radio" name="opcao" value="1" required>General
                            Inquiry</label>
                        <label>
                            <input type="radio" name="opcao" value="2">Reservation
                            Question</label>
                        <label>
                            <input type="radio" name="opcao" value="3">Website
                            suggestion</label>
                    </fieldset>
                    <label for="message" class="message">Message</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                    <div class="checkbox">
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                        <label for="newsletter">Please Subscribe me to the monthyly
                            newsletter</label>
                    </div>

                    <button type="submit" class="button">Get in Touch</button>
                </form>
            </div>
        </div>
        <div class="employee">
            <figure>
                <img src="images/employee1.jpg" alt="Employee 1">
                <figcaption>Sr John</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="Employee 2">
                <figcaption>Mrs Smith</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg" alt="Employee 3">
                <figcaption>Mrs Johnson</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 x WWR xIago Saboia x</p>
        <nav class="socialmedia a">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="facebook">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-square.svg" alt="instagram">
            </a>
            <a href="https://whatsapp.com">
                <img src="images/whatsapp.svg" alt="whatsapp">
            </a>
        </nav>
    </footer>
</body>

</html>
